  <rect x="40" y="98" width="240" height="525" rx="8" fill="none" stroke="#9ca3af"/>
  <g>
    <rect x="52" y="108" width="216" height="22" fill="#e5e7eb" stroke="#4b5563"/><text x="60" y="123">VAI TRÒ · BỐI CẢNH · CHẠY</text>
    <rect x="52" y="134" width="216" height="22" fill="#fee2e2" stroke="#dc2626"/><text x="60" y="149">QUY TẮC CHUNG</text>
    <rect x="52" y="160" width="216" height="22" fill="#e5e7eb" stroke="#4b5563"/><text x="60" y="175">BƯỚC 0 (prompt cơ bản)</text>

    <text x="52" y="200" font-weight="700" fill="#374151">+ Bài 2.1</text>
    <rect x="52" y="206" width="216" height="20" fill="#e5e7eb" stroke="#4b5563"/><text x="60" y="220">BƯỚC 1</text>
    <rect x="52" y="229" width="216" height="20" fill="#fee2e2" stroke="#dc2626"/><text x="60" y="243">QUY TẮC BỔ SUNG</text>
    <rect x="52" y="252" width="216" height="20" fill="#dbeafe" stroke="#2563eb"/><text x="60" y="266">KỸ NĂNG: TÓM TẮT 7 PHẦN</text>
    <rect x="52" y="275" width="216" height="20" fill="#ede9fe" stroke="#7c3aed"/><text x="60" y="289">KHUÔN TÓM TẮT</text>

    <text x="52" y="313" font-weight="700" fill="#374151">+ Bài 2.2</text>
    <rect x="52" y="319" width="216" height="20" fill="#e5e7eb" stroke="#4b5563"/><text x="60" y="333">BƯỚC 2</text>
    <rect x="52" y="342" width="216" height="20" fill="#fee2e2" stroke="#dc2626"/><text x="60" y="356">QUY TẮC BỔ SUNG</text>
    <rect x="52" y="365" width="216" height="20" fill="#dbeafe" stroke="#2563eb"/><text x="60" y="379">KỸ NĂNG: TRA HỎI 6W</text>
    <rect x="52" y="388" width="216" height="20" fill="#ede9fe" stroke="#7c3aed"/><text x="60" y="402">KHUÔN 6W</text>

    <text x="52" y="426" font-weight="700" fill="#374151">+ Lab 1 Autopsy</text>
    <rect x="52" y="432" width="216" height="20" fill="#e5e7eb" stroke="#4b5563"/><text x="60" y="446">BƯỚC 3</text>
    <rect x="52" y="455" width="216" height="20" fill="#fee2e2" stroke="#dc2626"/><text x="60" y="469">QUY TẮC BỔ SUNG</text>
    <rect x="52" y="478" width="216" height="20" fill="#dbeafe" stroke="#2563eb"/><text x="60" y="492">KỸ NĂNG: REQUIREMENT AUTOPSY</text>
    <rect x="52" y="501" width="216" height="20" fill="#ffedd5" stroke="#ea580c"/><text x="60" y="515">TRI THỨC NGÀNH: VOUCHER</text>
    <rect x="52" y="524" width="216" height="20" fill="#ede9fe" stroke="#7c3aed"/><text x="60" y="538">KHUÔN AUTOPSY</text>

    <text x="52" y="562" font-weight="700" fill="#374151">+ Lab 1 FACT</text>
    <rect x="52" y="568" width="216" height="20" fill="#e5e7eb" stroke="#4b5563"/><text x="60" y="582">BƯỚC 4</text>
    <rect x="52" y="591" width="105" height="20" fill="#dbeafe" stroke="#2563eb"/><text x="58" y="605">KỸ NĂNG: FACT</text>
    <rect x="163" y="591" width="105" height="20" fill="#ede9fe" stroke="#7c3aed"/><text x="169" y="605">KHUÔN FACT</text>
