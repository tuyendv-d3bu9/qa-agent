    <text x="470" y="300">tom-tat-7-phan.md</text>
    <text x="470" y="318">tra-hoi-6w.md</text>
    <text x="470" y="336">requirement-autopsy.md</text>
    <text x="470" y="354">tu-kiem-fact.md</text>
