  <!-- arrow -->
  <path d="M300 360 L420 360" stroke="#111827" stroke-width="3" fill="none"/>
  <path d="M420 360 L408 352 L408 368 Z" fill="#111827"/>
  <text x="360" y="345" text-anchor="middle" font-weight="700">TÁCH</text>
  <text x="360" y="385" text-anchor="middle" font-size="11" fill="#4b5563">cắt dán nguyên văn</text>
  <text x="360" y="400" text-anchor="middle" font-size="11" fill="#4b5563">theo "khi nào thay đổi"</text>

  <!-- RIGHT -->
  <text x="700" y="90" text-anchor="middle" font-weight="700" font-size="14">Sau khi tách</text>
  <g>
    <rect x="440" y="104" width="520" height="66" rx="8" fill="#e5e7eb" stroke="#4b5563"/>
    <text x="456" y="126" font-weight="700">prompt_chinh.md (~40 dòng)</text>
    <text x="456" y="146">Vai trò · Bối cảnh · Bảng luồng: bước nào đọc file nào, ghi ra đâu</text>
    <text x="456" y="162" fill="#4b5563">Thay đổi khi: đổi cách làm việc</text>

    <rect x="440" y="186" width="520" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
