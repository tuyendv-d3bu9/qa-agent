    <text x="700" y="336" fill="#4b5563">Thêm kỹ năng = thêm 1 file</text>

    <rect x="440" y="396" width="520" height="56" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text x="456" y="418" font-weight="700">domain/voucher-tmdt.md</text>
    <text x="456" y="438">Domain Checklist D01–D23 · Thay đổi khi: đổi ngành</text>

    <rect x="440" y="468" width="520" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="456" y="490" font-weight="700">khuon/</text>
    <text x="470" y="510">01-tom-tat · 02-6w · 03-autopsy · 04-fact</text>
    <text x="700" y="490" fill="#4b5563">Thay đổi khi: đổi format báo cáo</text>

    <rect x="440" y="550" width="520" height="56" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="5 4"/>
    <text x="456" y="572" font-weight="700">de_bai/</text>
    <text x="456" y="592">Đã là file riêng từ đầu · Thay đổi khi: đổi dự án</text>
  </g>
</svg>
